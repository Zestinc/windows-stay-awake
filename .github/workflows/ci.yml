name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Script must carry a UTF-8 BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows PowerShell 5.1 decodes BOM-less files using the system ANSI
          # code page, which mangles the Chinese strings and breaks parsing.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\StayAwake.ps1))
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw ('StayAwake.ps1 has no UTF-8 BOM (first bytes: {0:X2} {1:X2} {2:X2})' -f $bytes[0], $bytes[1], $bytes[2])
          }
          Write-Host 'UTF-8 BOM present: OK'

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1 for this job' }
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\StayAwake.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List -Force; throw 'Parse failed' }
          Write-Host 'Parse OK'

      - name: Chinese output survives round-trip decoding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Guards the same failure at runtime rather than only at parse time.
          # This workflow file itself is BOM-less, so the expected string is built
          # from code points instead of being written literally.
          $expect = -join ([char]0x7535, [char]0x6E90, [char]0x65B9, [char]0x6848)  # 电源方案
          $out = .\StayAwake.ps1 -Status 6>&1 | Out-String
          if ($out -notmatch $expect) { throw "Chinese labels came back mangled:`n$out" }
          Write-Host 'Chinese labels intact: OK'

      - name: Status is read-only and needs no elevation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $before = & powercfg /query SCHEME_CURRENT | Out-String
          .\StayAwake.ps1 -Status
          if ($LASTEXITCODE -ne 0) { throw "Status exited $LASTEXITCODE" }
          $after = & powercfg /query SCHEME_CURRENT | Out-String
          if ($before -ne $after) { throw 'Status mutated power configuration' }
          Write-Host 'Status is read-only: OK'

      - name: Apply preset tier, then assert every timeout is zero
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\StayAwake.ps1
          if ($LASTEXITCODE -ne 0) { throw "Apply exited $LASTEXITCODE" }

          # Independent check: re-read the registry directly, not through the script.
          $scheme = ([regex]::Match((& powercfg /getactivescheme | Out-String),
            '[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}')).Value
          $cases = @(
            @{ Sub='7516b95f-f776-4464-8c53-06167f40cc99'; Set='3c0bc021-c8a8-4e07-a973-6b14cbcb2b7e'; Name='monitor timeout' },
            @{ Sub='7516b95f-f776-4464-8c53-06167f40cc99'; Set='8ec4b3a5-6868-48c2-be75-4f3044be88a7'; Name='console lock display off' },
            @{ Sub='238c9fa8-0aad-41ed-83f4-97be242c8f20'; Set='29f6c1db-86da-48c5-9fdb-f2b67b1f44da'; Name='standby timeout' },
            @{ Sub='238c9fa8-0aad-41ed-83f4-97be242c8f20'; Set='9d7815a6-7ee4-497e-8888-515a05f02364'; Name='hibernate timeout' },
            @{ Sub='238c9fa8-0aad-41ed-83f4-97be242c8f20'; Set='7bc4a2f9-d8fc-4469-b07b-33eb785aaca0'; Name='unattended sleep' },
            @{ Sub='0012ee47-9041-4b5d-9b77-535fba8b1442'; Set='6738e2c4-e8a5-4a42-b16a-e040e769756e'; Name='disk timeout' }
          )
          foreach ($c in $cases) {
            $p = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes\$scheme\$($c.Sub)\$($c.Set)"
            $v = Get-ItemProperty -Path $p -ErrorAction Stop
            if ($v.ACSettingIndex -ne 0) { throw "$($c.Name) AC = $($v.ACSettingIndex), expected 0" }
            if ($v.DCSettingIndex -ne 0) { throw "$($c.Name) DC = $($v.DCSettingIndex), expected 0" }
            Write-Host "  $($c.Name): AC=0 DC=0 OK"
          }

          $inact = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').InactivityTimeoutSecs
          if ($inact -ne 0) { throw "InactivityTimeoutSecs = $inact, expected 0" }
          Write-Host '  InactivityTimeoutSecs: 0 OK'

      - name: Preset tier must not weaken authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # CONSOLELOCK (prompt for password on wake) belongs to the opt-in tier only.
          $scheme = ([regex]::Match((& powercfg /getactivescheme | Out-String),
            '[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}')).Value
          $p = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes\$scheme\fea3413e-88d6-4123-a466-e9f8b03e494d\0e796bdb-100d-47d6-a2d5-f7d2daa51f51"
          $consoleLock = if (Test-Path $p) { (Get-ItemProperty $p).ACSettingIndex } else { 'unset' }
          if ($consoleLock -eq 0) { throw 'Preset tier disabled the wake password prompt; that belongs to -DisableLockScreen' }

          $nolock = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization' -ErrorAction SilentlyContinue
          if ($nolock -and $nolock.NoLockScreen -eq 1) { throw 'Preset tier disabled the lock screen' }

          $winl = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -ErrorAction SilentlyContinue
          if ($winl -and $winl.PSObject.Properties.Name -contains 'DisableLockWorkstation' -and $winl.DisableLockWorkstation -eq 1) {
            throw 'Preset tier disabled Win+L'
          }
          Write-Host 'Security boundary intact after preset apply: OK'

      - name: Apply is idempotent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\StayAwake.ps1
          if ($LASTEXITCODE -ne 0) { throw "Second apply exited $LASTEXITCODE" }
          .\StayAwake.ps1
          if ($LASTEXITCODE -ne 0) { throw "Third apply exited $LASTEXITCODE" }
          Write-Host 'Idempotent: OK'

      - name: Restore returns settings to the recorded originals
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The very first backup holds the pristine pre-test values.
          $first = Get-ChildItem "$env:ProgramData\StayAwake\backup-*.json" |
                   Where-Object { $_.Name -ne 'backup-latest.json' } |
                   Sort-Object Name | Select-Object -First 1
          Write-Host "Restoring from $($first.FullName)"
          .\StayAwake.ps1 -Restore -BackupFile $first.FullName
          if ($LASTEXITCODE -ne 0) { throw "Restore exited $LASTEXITCODE" }

          # Restore recovers the effective value, not the presence of a registry
          # key: powercfg has no "unset", and /setactive rebuilds a deleted key.
          $backup = Get-Content $first.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $scheme = $backup.Scheme
          $checked = 0
          foreach ($item in ($backup.Items | Where-Object { $_.Kind -eq 'power' })) {
            if ($null -eq $item.AC -and $null -eq $item.DC) { continue }
            $p = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes\$scheme\$($item.Sub)\$($item.Setting)"
            $v = Get-ItemProperty -Path $p -ErrorAction Stop
            if ($null -ne $item.AC -and "$($v.ACSettingIndex)" -ne "$($item.AC)") { throw "$($item.Key) AC = $($v.ACSettingIndex), expected $($item.AC)" }
            if ($null -ne $item.DC -and "$($v.DCSettingIndex)" -ne "$($item.DC)") { throw "$($item.Key) DC = $($v.DCSettingIndex), expected $($item.DC)" }
            $checked++
          }
          if ($checked -lt 5) { throw "Only $checked power settings were verified; the backup looks empty" }
          Write-Host "Restore verified against the pristine backup ($checked settings): OK"

      - name: Backed-up values are effective values, never null
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Regression guard: an earlier version recorded "unset" for keys that
          # were merely absent, then tried to roll back by deleting the key.
          $latest = Get-Content "$env:ProgramData\StayAwake\backup-latest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($item in ($latest.Items | Where-Object { $_.Kind -eq 'power' })) {
            if ($null -eq $item.AC -or $null -eq $item.DC) {
              throw "$($item.Key) backed up as null (Source=$($item.Source)); expected a resolved effective value"
            }
          }
          Write-Host 'Every power setting backed up with a concrete effective value: OK'

      - name: Hibernate toggle is best-effort, not a hard dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # These runners do not support hibernation, so this asserts that an
          # unsupported optional toggle degrades instead of failing the run.
          $supported = (& powercfg /availablesleepstates | Out-String) -match 'Hibernate'
          Write-Host "Hibernation supported on this runner: $supported"
          .\StayAwake.ps1
          if ($LASTEXITCODE -ne 0) { throw "Apply must survive an unsupported hibernate toggle (exit $LASTEXITCODE)" }
          .\StayAwake.ps1 -Restore
          if ($LASTEXITCODE -ne 0) { throw "Restore must survive an unsupported hibernate toggle (exit $LASTEXITCODE)" }
          Write-Host 'Hibernate toggle degraded cleanly: OK'

      - name: Restore does not enable hibernation that was originally off
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power'
          $before = (Get-ItemProperty $key -ErrorAction SilentlyContinue).HibernateEnabled
          .\StayAwake.ps1  | Out-Null
          .\StayAwake.ps1 -Restore | Out-Null
          $after = (Get-ItemProperty $key -ErrorAction SilentlyContinue).HibernateEnabled
          if ("$before" -ne "$after") { throw "HibernateEnabled drifted across apply+restore: $before -> $after" }
          Write-Host "HibernateEnabled preserved ($before): OK"

      - name: Opt-in tier applies and restores
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\StayAwake.ps1 -DisableLockScreen
          if ($LASTEXITCODE -ne 0) { throw "DisableLockScreen apply exited $LASTEXITCODE" }

          $nolock = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization').NoLockScreen
          if ($nolock -ne 1) { throw "NoLockScreen = $nolock, expected 1" }
          $winl = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').DisableLockWorkstation
          if ($winl -ne 1) { throw "DisableLockWorkstation = $winl, expected 1" }
          Write-Host '  opt-in tier applied OK'

          .\StayAwake.ps1 -Restore
          if ($LASTEXITCODE -ne 0) { throw "Restore after opt-in exited $LASTEXITCODE" }
          Write-Host '  restore after opt-in OK'

      - name: Guard mode holds an execution-state request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'guard-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'guard-err.txt'
          $proc = Start-Process powershell -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $out -RedirectStandardError $err `
            -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','.\StayAwake.ps1','-Guard'
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            Write-Host '--- guard stdout ---'; Get-Content $out -ErrorAction SilentlyContinue | Write-Host
            Write-Host '--- guard stderr ---'; Get-Content $err -ErrorAction SilentlyContinue | Write-Host
            throw "Guard exited early with code $($proc.ExitCode)"
          }

          # Staying alive proves nothing on its own; assert the kernel actually
          # holds a DISPLAY and a SYSTEM request naming a powershell process.
          $requests = & powercfg /requests | Out-String
          Write-Host $requests
          Stop-Process -Id $proc.Id -Force

          foreach ($section in @('DISPLAY', 'SYSTEM')) {
            $m = [regex]::Match($requests, "(?ms)^$section\:\s*\r?\n(.*?)(\r?\n\r?\n|\z)")
            if (-not $m.Success) { throw "powercfg /requests has no $section section" }
            $body = $m.Groups[1].Value
            if ($body -match 'None\.') { throw "$section request was not held (reported None)" }
            if ($body -notmatch 'powershell\.exe') { throw "$section request is not attributed to powershell.exe:`n$body" }
            Write-Host "  $section request held by powershell.exe: OK"
          }

          # And it must let go on exit rather than leaking a permanent request.
          Start-Sleep -Seconds 2
          $after = & powercfg /requests | Out-String
          $m = [regex]::Match($after, "(?ms)^DISPLAY\:\s*\r?\n(.*?)(\r?\n\r?\n|\z)")
          if ($m.Success -and $m.Groups[1].Value -match 'powershell\.exe') {
            throw "DISPLAY request survived guard exit:`n$($m.Groups[1].Value)"
          }
          Write-Host '  request released after exit: OK'

      - name: Launcher forwards arguments without a pause
        shell: cmd
        env:
          STAYAWAKE_NO_PAUSE: '1'
        run: |
          StayAwake.cmd -Status
          if errorlevel 1 exit /b 1
          echo Launcher OK

      - name: Launcher survives arguments containing cmd metacharacters
        shell: cmd
        env:
          STAYAWAKE_NO_PAUSE: '1'
        run: |
          rem The old launcher piped the argument list through `echo` to guess
          rem whether it needed elevation, which let an ampersand in a path run
          rem as a command. Note that `rem` itself does not protect one, so this
          rem comment must not contain the character it is describing.
          rem Nothing may execute here except the script, and the path must
          rem arrive intact.
          StayAwake.cmd -Restore -BackupFile "%RUNNER_TEMP%\a & b\nope.json" > out.txt 2>&1
          echo --- script output ---
          type out.txt
          echo ---------------------
          if not errorlevel 1 (
            echo FAIL: expected a nonzero exit for a missing backup file
            exit /b 1
          )
          findstr /C:"a & b" out.txt >nul
          if errorlevel 1 (
            echo FAIL: argument with metacharacters did not reach the script intact
            exit /b 1
          )
          if exist "b\nope.json" (
            echo FAIL: part of the argument executed as a command
            exit /b 1
          )
          echo Metacharacter argument forwarded intact OK

      - name: Already-elevated runs execute directly instead of re-launching
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Guards against an elevation loop: when the caller is already an
          # administrator the script must do the work in-process.
          $before = (Get-Process powershell -ErrorAction SilentlyContinue).Count
          $out = .\StayAwake.ps1 6>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Apply exited $LASTEXITCODE" }
          if ($out -match [regex]::Escape((-join ([char]0x8BF7, [char]0x6C42)))) {
            throw "Elevation was requested despite already running as administrator:`n$out"
          }
          $after = (Get-Process powershell -ErrorAction SilentlyContinue).Count
          if ($after -gt $before) { throw "Elevation spawned an extra powershell process ($before -> $after)" }
          .\StayAwake.ps1 -Restore | Out-Null
          Write-Host 'No elevation loop when already administrator: OK'
